# office-agent — one-command containerized stack.
#
#   docker compose up -d --build
#   open http://localhost:3000  (office)  and  http://localhost:3100  (dashboard)
#
# Agents use Claude Code. Provide auth ONE of two ways:
#   1) mount your host Claude login (Max/Team/Pro subscription — NO API key):
#      the ~/.claude volume below is enabled by default. Run `claude` once on the
#      host and log in first. Mounted read-write so the access token can refresh.
#   2) or set ANTHROPIC_API_KEY in a .env file next to this compose file.

services:
  office-agent:
    build: .
    image: office-agent
    container_name: office-agent
    restart: unless-stopped
    ports:
      - "3000:8000"     # 3D office   (host 3000 -> socat -> container 3000)
      - "3100:8100"     # dashboard   (host 3100 -> socat -> container 3100)
      # bridge (18789) stays internal; Claw3D reaches it over loopback.
    environment:
      PAPERCLIP_PORT: "3100"
      CLAW3D_PORT: "3000"
      GATEWAY_PORT: "18789"
      COMPANY: "${COMPANY:-}"
      AUTOSCALE: "${AUTOSCALE:-0}"
      AUTOSCALE_MAX: "${AUTOSCALE_MAX:-5}"
      AUTOSCALE_PER_AGENT: "${AUTOSCALE_PER_AGENT:-3}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"   # optional: control the firm from Telegram
      TELEGRAM_OWNER_ID: "${TELEGRAM_OWNER_ID:-}"
      # ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"   # option 2 for Claude auth
    volumes:
      - office_data:/home/node/.paperclip          # persist company/agents/db
      - ${HOME}/.claude:/home/node/.claude          # Claude subscription login (rw for token refresh)

volumes:
  office_data:
